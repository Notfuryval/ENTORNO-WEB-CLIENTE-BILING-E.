<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Pet Shop</h1>

    <form id="petForm">
        <label for="name">Name</label>
        <input type="text" id="name">
        <small id="nameError" class="error-message"></small>

        <label for="description">Description</label>
        <textarea id="description"></textarea>
        <small id="descriptionError" class="error-message"></small>

        <label for="image">Image URL</label>
        <input type="text" id="image">
        <small id="imageError" class="error-message"></small>

        <label for="birthdate">Birthdate</label>
        <input type="date" id="birthdate">
        <small id="birthdateError" class="error-message"></small>

        <label for="price">Price</label>
        <input type="number" id="price">
        <small id="priceError" class="error-message"></small>

        <label for="code">Code</label>
        <input type="text" id="code">
        <small id="codeError" class="error-message"></small>

        <label>
            <input type="checkbox" id="sold">
            Sold
        </label>

        <button type="submit">Add pet</button>
    </form>

    <h2>Pets</h2>

    <div id="petList"></div>

    <script src="script.js"></script>

</body>
</html>
