<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Heroes</title>

  <style>
    /*Cards styles*/
    main.row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
    }

    .card {
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
    }

    .card-title {
      margin-top: 0;
    }

    /*Header, footer, and body styles.*/
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #202020;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    footer {
      background-color: #202020;
      color: white;
      padding: 15px;
      text-align: center;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Marvel Heroes</h1>
  </header>
  <main class="row"></main>

  <template id="card-template">
    <div class="card">
      <img class="card-image" src="" alt="">
      <div class="card-body">
        <h2 class="card-title"></h2>
        <p class="card-description"></p>
        <a class="card-link" href="" target="_blank">View more</a>
      </div>
    </div>
  </template>

  <footer>
    <p>Marvel Heroes</p>
  </footer>

  <script src="jspractica.js"></script>
</body>
</html>
